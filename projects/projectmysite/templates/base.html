{% load static %}

<!doctype html>
<html lang="ko">

<head>
    <!-- =====================================================
         문서 기본 설정
    ====================================================== -->

    <!-- 한글을 정상적으로 표시하기 위한 문자 인코딩 -->
    <meta charset="utf-8">

    <!-- 모바일 화면에서도 실제 기기 너비에 맞춰 출력한다. -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <!-- =====================================================
         Bootstrap CSS

         게시판 전체 화면에서 공통으로 사용하는
         Bootstrap 스타일 파일을 불러온다.
    ====================================================== -->
    <link rel="stylesheet"
          type="text/css"
          href="{% static 'bootstrap.min.css' %}">

    <title>Hello, pybo!</title>
</head>

<body>

    <!-- =====================================================
         1. 내비게이션 영역

         모든 화면 상단에 navbar.html을 출력한다.
    ====================================================== -->
    {% include "navbar.html" %}


    <!-- =====================================================
         2. Django 일회성 메시지 영역

         성공, 오류, 경고, 정보 메시지에 따라
         서로 다른 Bootstrap 색상을 적용한다.
    ====================================================== -->
    {% if messages %}
    <div class="container my-3">

        {% for message in messages %}

        <div class="alert
                    {% if message.tags == 'error' %}
                        alert-danger
                    {% elif message.tags == 'success' %}
                        alert-success
                    {% elif message.tags == 'warning' %}
                        alert-warning
                    {% elif message.tags == 'info' %}
                        alert-info
                    {% else %}
                        alert-secondary
                    {% endif %}"
             role="alert">

            {{ message }}

        </div>

        {% endfor %}

    </div>
    {% endif %}


    <!-- =====================================================
         3. 화면별 본문 영역

         질문 목록, 질문 상세, 질문 등록 등의 화면 내용이
         아래 content 블록 위치에 삽입된다.

         주의:
         content 블록은 base.html 안에서 한 번만 선언해야 한다.
    ====================================================== -->
    {% block content %}
    {% endblock %}


    <!-- =====================================================
         4. JavaScript 파일

         HTML 화면을 먼저 만든 다음 JavaScript를 불러오도록
         body 태그의 마지막 부분에 배치한다.
    ====================================================== -->

    <!-- Bootstrap 동작에 필요한 jQuery -->
    <script src="{% static 'jquery-4.0.0.min.js' %}"></script>

    <!-- 내비게이션 햄버거 버튼 등의 동작을 처리한다. -->
    <script src="{% static 'bootstrap.min.js' %}"></script>

</body>

</html>
