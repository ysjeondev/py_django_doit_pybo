{% extends "base.html" %}
{% block content %}
<div class="container my-3">
<form method="post"
          action="{% url 'common:login' %}">
{% csrf_token %}
<!-- 폼 입력 오류 출력 -->
        {% include "form_errors.html" %}

<!-- 로그인 후 원래 페이지로 돌아가기 위한 값 -->
        <input type="hidden"
               name="next"
               value="{{ next }}">
<!-- 사용자 아이디 -->
        <div class="form-group">
            <label for="username">
                사용자 ID
            </label>
<input type="text"
                   class="form-control"
                   name="username"
                   id="username"
                   value="{{ form.username.value|default_if_none:'' }}">
        </div>
<!-- 비밀번호 -->
        <div class="form-group">
            <label for="password">
                비밀번호
            </label>
<input type="password"
                   class="form-control"
                   name="password"
                   id="password">
        </div>
<button type="submit"
                class="btn btn-primary">
            로그인
        </button>
</form>
</div>
{% endblock %}
