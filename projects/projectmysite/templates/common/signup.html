{% extends "base.html" %}
{% block content %}
<div class="container my-3">
<h4 class="my-3 border-bottom pb-2">
        회원가입
    </h4>
<form method="post"
          action="{% url 'common:signup' %}">
{% csrf_token %}
<!-- 회원가입 오류 출력 -->
        {% include "form_errors.html" %}
<!-- 사용자 아이디 -->
        <div class="form-group">
            <label for="username">
                사용자 이름
            </label>
<input type="text"
                   class="form-control"
                   name="username"
                   id="username"
                   value="{{ form.username.value|default_if_none:'' }}">
        </div>
<!-- 비밀번호 -->
        <div class="form-group">
            <label for="password1">
                비밀번호
            </label>
<input type="password"
                   class="form-control"
                   name="password1"
                   id="password1">
        </div>
<!-- 비밀번호 확인 -->
        <div class="form-group">
            <label for="password2">
                비밀번호 확인
            </label>
            <input type="password"
                   class="form-control"
                   name="password2"
                   id="password2">
        </div>
<!-- 이메일 -->
        <div class="form-group">
            <label for="email">
                이메일
            </label>
            <input type="email"
                   class="form-control"
                   name="email"
                   id="email"
                   value="{{ form.email.value|default_if_none:'' }}">
        </div>
            <button type="submit"
                class="btn btn-primary">
            계정 생성
        </button>
</form>
</div>
{% endblock %}
