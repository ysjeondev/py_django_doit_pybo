{% extends 'base.html' %}

{% block content %}
<div class="container my-3">
    <h5 class="my-3 border-bottom pb-2">
        {% if form.instance.pk %}
            질문 수정
        {% else %}
            질문 등록
        {% endif %}

    </h5>

    <form method="post">
        {% csrf_token %}
        <!-- 오류 표시 Start-->
         {% if form.errors %}
            <div class ="alert alert-danger" role="alert">
                {% for field in form %}
                    {% if field.errors%}
                        <strong>{{field.label}} </strong>
                        {{field.errors}}
                    {% endif %}
                {%endfor%}
            </div>
        {% endif %}
        <!-- 오류표시 End-->
        <div class="mb-3">
            <label for="subject" class="form-label">제목</label>

            <input type="text"
                   class="form-control"
                   name="subject"
                   id="subject"
                   value="{{ form.subject.value|default_if_none:'' }}">
        </div>

        <div class="mb-3">
            <label for="content" class="form-label">내용</label>

            <textarea class="form-control"
                      name="content"
                      id="content"
                      rows="10">{{ form.content.value|default_if_none:'' }}
            </textarea>
        </div>

        <button type="submit" class="btn btn-primary">
            {% if form.instance.pk %}
                수정 완료
            {% else %}
                저장하기
            {% endif %}
        </button>
    </form>
</div>
{% endblock %}
