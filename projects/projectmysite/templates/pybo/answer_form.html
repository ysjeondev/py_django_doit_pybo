{% extends 'base.html' %}

{% block content %}
<div class="container my-3">

    <h5 class="my-3 border-bottom pb-2">
        답변 수정
    </h5>

    <form method="post">

        {% csrf_token %}

        <!-- AnswerForm 검증 중 발생한 오류를
             공통 오류 템플릿을 이용해 출력한다. -->
        {% include "form_errors.html" %}

        <div class="form-group">
            <label for="content">
                답변 내용
            </label>

            <!-- 기존 답변을 수정하는 화면이므로
                 form.content.value를 textarea 내부에 출력한다.
                 값이 None이면 빈 문자열을 사용한다. -->
            <textarea name="content"
                      id="content"
                      class="form-control"
                      rows="10">{{ form.content.value|default_if_none:'' }}</textarea>
        </div>

        <button type="submit"
                class="btn btn-primary">
            수정 완료
        </button>

        <!-- 수정하지 않고 원래 질문 상세 화면으로 돌아간다. -->
        <a href="{% url 'pybo:detail' answer.question.id %}"
           class="btn btn-secondary ml-2">
            취소
        </a>

    </form>

</div>
{% endblock %}
